# What pubhost's Python suite does not run: the hosting modules (terraform/),
# the deploy-static scripts, terraform.yml as GitHub reads it, and the
# docker-build action. Each module's tests mock its providers, so nothing
# here needs credentials. Terraform is the oldest version the modules allow,
# 1.11. `hosting / passed` is required on main, beside `ci / passed`.
name: hosting

on:
  push: { branches: [main] }
  pull_request:
  # The merge queue's run: a required check must report on it too.
  merge_group:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    # One module's flaky provider download does not cancel the others.
    strategy:
      fail-fast: false
      matrix:
        module: [dns-zone, hosting, cloud-run-sites, desec-zones, cloud-run-service, backup-bucket, cloud-run-access]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.11.4, terraform_wrapper: false }
      - run: terraform -chdir="terraform/$MODULE" fmt -check -recursive
        env: { MODULE: '${{ matrix.module }}' }
      # The modules keep no lock file, so the providers' cache is keyed on
      # the module's .tf files, which constrain their versions. init fetches
      # each provider's SHA256SUMS from GitHub even from the cache, and that
      # fetch sometimes times out, so it is tried three times.
      - run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ matrix.module }}-${{ hashFiles(format('terraform/{0}/**/*.tf', matrix.module)) }}
      - uses: Sustenaut/pubkit/actions/terraform-init@afabaf91f5285f163967383edaadaee927e0c30a # v0.35.1
        with:
          dir: terraform/${{ matrix.module }}
          args: -backend=false -input=false
          pause: '10'
      - run: terraform -chdir="terraform/$MODULE" validate
        env: { MODULE: '${{ matrix.module }}' }
      - run: terraform -chdir="terraform/$MODULE" test
        env: { MODULE: '${{ matrix.module }}' }

  deploy-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck actions/deploy-static/*.sh
      - run: actions/deploy-static/test.sh
      # terraform.yml, as GitHub and shellcheck read it. actionlint is the release's binary, checked
      # against its sha256.
      - name: actionlint terraform.yml
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/terraform.yml
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

  # Builds one image twice under one scope: the second must come from the cache.
  docker-build-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/docker-build
        with:
          tags: docker-build-test:first
          scope: docker-build-test-${{ github.run_id }}-${{ github.run_attempt }}
          context: actions/docker-build/test
      - uses: ./actions/docker-build
        with:
          tags: docker-build-test:second
          scope: docker-build-test-${{ github.run_id }}-${{ github.run_attempt }}
          context: actions/docker-build/test
      - run: |
          first=$(docker run --rm docker-build-test:first cat /built)
          second=$(docker run --rm docker-build-test:second cat /built)
          echo "first $first, second $second"
          [ -n "$first" ] && [ "$first" = "$second" ]

  passed:
    # The required check's name, as pubkit.json's protect.checks lists it.
    name: hosting / passed
    if: ${{ !cancelled() }}
    needs: [terraform, deploy-static, docker-build-action]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(to_entries[]; .value.result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }
